<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>You'll Miss It!</title>
    <meta
      name="description"
      content="Official site for You'll Miss It! — explore the dungeon to find our merch, music, videos and more."
    />
    <meta property="og:title" content="You'll Miss It!" />
    <meta
      property="og:description"
      content="Explore the dungeon to find our merch, music, videos and more."
    />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Only requested on first press otherwise, which would flash an empty button. -->
    <link rel="preload" as="image" href="/assets/Buttons_Inventory/button_clicked.png" />
    <!-- Plausible analytics — replace data-domain with the real live domain before launch -->
    <script defer data-domain="REPLACE_WITH_DOMAIN" src="https://plausible.io/js/script.js"></script>
  </head>
  <body>
    <div id="game-container"></div>

    <!-- Mirrored continuations of the dungeon, filling the letterbox on wide screens. -->
    <div class="bg-extend bg-left" aria-hidden="true"></div>
    <div class="bg-extend bg-right" aria-hidden="true"></div>

    <div id="control-hint">
      <span class="touch-only">Hold either side to move &middot; Swipe up to jump</span>
      <span class="desk-only">A / D to move &middot; W to jump</span>
    </div>

    <div id="inventory-strip" aria-label="Collected items"></div>

    <button id="mute-button" class="pixel-button" type="button" aria-label="Mute audio" aria-pressed="false" title="Mute">
      <svg class="icon-unmuted" viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>

    <!--
      Single source of truth for every destination link, including the footer bar fallback below.
      The in-game hotspots read these same hrefs at click-time via data-key, so updating a link
      here (e.g. "featured" whenever there's a new song/video to push) updates everywhere at once.
    -->
    <nav id="footer-links" aria-label="Quick links">
      <a href="https://www.facebook.com/youllmissitband" data-key="merch" class="pixel-button" target="_blank" rel="noopener">Merch</a>
      <a href="https://www.youtube.com/@youllmissitband" data-key="youtube" class="pixel-button" target="_blank" rel="noopener">YouTube</a>
      <a href="https://open.spotify.com/artist/7j7orpegluM2SitFkmRehM" data-key="streaming" class="pixel-button" target="_blank" rel="noopener">Listen</a>
      <a href="https://www.instagram.com/youllmissitband/" data-key="socials" class="pixel-button" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.youtube.com/watch?v=uWf9XiMkqKM" data-key="featured" class="pixel-button" target="_blank" rel="noopener">Featured</a>
    </nav>

    <div id="completion-overlay" class="overlay">
      <div class="overlay-card">
        <h2>Seems Like You Didn't Miss Anything</h2>
        <p>Thanks for exploring, Keep Watching 🖤</p>
        <button id="completion-close" class="pixel-button" type="button">Back to Game</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
